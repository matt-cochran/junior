name: Claude smoke
# Model-free checks of the Claude Code deny rules Junior writes (#214-#216).
# No model is called and no secret is used: the live check (a real Claude Code
# session attempting store reads) is done by the release manager in-session and
# recorded as plan evidence.
on:
  pull_request:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  claude-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Rule grammar and coverage
        run: node --test harness-rule-grammar.test.ts
      - name: Smoke verdict self-test (offline fake Claude)
        run: node scripts/claude-smoke.mjs --self-test
