name: Claude smoke
on:
  workflow_dispatch: null
  schedule:
    # Daily at 06:00 UTC: catch a Claude Code release that changes deny rules.
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  claude-smoke:
    runs-on: ubuntu-latest
    environment: claude-smoke
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - name: Self-test the smoke verdict offline
        run: node scripts/claude-smoke.mjs --self-test
      - name: Prove Claude Code loads the store deny rules
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/claude-smoke.mjs
