name: Test
on:
  workflow_call:

permissions:
  contents: read
jobs:
  full:
    name: Full suite (ubuntu-22.04, Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node:
        - 24
        - 26
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: npm
    - run: npm ci
    - run: npm test
  smoke:
    name: Installed CLI smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-22.04
        - ubuntu-22.04-arm
        - macos-15-intel
        - macos-15
        - windows-latest
        - windows-11-arm
        node:
        - 24
        - 26
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: npm
    - run: npm ci
    - run: npm run build
    - run: node scripts/smoke-installed.mjs
