name: Dev ticket
on:
  pull_request_target:
    branches: [dev]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  ticket:
    name: Dev ticket
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # No checkout or PR code execution: only GitHub metadata is read.
      - name: Require a real issue for this change
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUNNER_MODE: ${{ vars.CI_RUNNER_MODE || 'github' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          if (!['github', 'blacksmith'].includes(process.env.CI_RUNNER_MODE)) throw new Error('Invalid CI_RUNNER_MODE');
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          if (pr.base.ref !== 'dev') throw new Error('This policy applies only to dev PRs');
          const repository = process.env.GITHUB_REPOSITORY;
          const text = `${pr.title}\n${pr.body || ''}`;
          const refs = new Map();
          for (const m of text.matchAll(/https:\/\/github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/issues\/([1-9][0-9]*)/g)) refs.set(`${m[1]}#${m[2]}`, [m[1], m[2]]);
          for (const m of text.matchAll(/(?:^|[\s(])(?:([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+))?#([1-9][0-9]*)\b/g)) {
            const repo = m[1] || repository;
            refs.set(`${repo}#${m[2]}`, [repo, m[2]]);
          }
          if (!refs.size) throw new Error('Link a GitHub issue in the PR title or body: Refs #123 or an issue URL');
          for (const [repo, number] of [...refs.values()].slice(0, 20)) {
            // GitHub owner names are case-insensitive.
            if (!['matt-cochran-products', 'matt-cochran'].includes(repo.split('/')[0].toLowerCase())) continue;
            const response = await fetch(`https://api.github.com/repos/${repo}/issues/${number}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
            });
            if (response.status === 404) continue;
            if (!response.ok) throw new Error(`Cannot verify issue metadata: HTTP ${response.status}`);
            const issue = await response.json();
            if (issue.pull_request) continue;
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Change tracked by [${repo}#${number}](${issue.html_url}).\n`);
            process.exit(0);
          }
          throw new Error('No accessible GitHub issue was verified. PR links and issue-shaped text do not count; use a readable issue in the managed repositories.');
          NODE
